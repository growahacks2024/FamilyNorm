<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para mi familia ❤️</title>
<style>
body {
  margin: 0;
  padding: 40px 20px;
  font-family: Arial, sans-serif;
  color: white;
  background: linear-gradient(180deg, #0a0a1a 0%, #1a1a3a 100%);
  min-height: 100vh;
  text-align: center;
  overflow-x: hidden;
}

.jupiter-container {
  position: fixed;
  top: 15%;
  right: 8%;
  width: 100px;
  height: 100px;
  z-index: 1;
  animation: floatJupiter 10s ease-in-out infinite;
}

.jupiter {
  width: 80px;
  height: 80px;
  background: radial-gradient(circle at 30% 30%, #d8ca9d, #c9a66b, #8b6f47);
  border-radius: 50%;
  box-shadow: 0 0 40px rgba(201, 166, 107, 0.6);
  position: absolute;
  left: 10px;
  top: 10px;
}

.ring {
  position: absolute;
  width: 140px;
  height: 40px;
  border: 3px solid rgba(200, 180, 140, 0.4);
  border-radius: 50%;
  top: 30px;
  left: -20px;
  transform: rotate(20deg);
}

@keyframes floatJupiter {
 0%, 100% { transform: translateY(0); }
 50% { transform: translateY(20px); }
}

.star {
  position: fixed;
  width: 2px;
  height: 2px;
  background: white;
  border-radius: 50%;
  box-shadow: 0 0 6px white;
  animation: shooting 3s linear infinite;
  opacity: 0;
}

@keyframes shooting {
 0% { transform: translateY(-100px) translateX(0); opacity: 0; }
  10% { opacity: 1; }
 100% { transform: translateY(100vh) translateX(120px); opacity: 0; }
}

.heart {
  position: fixed;
  color: #ff4d6d;
  font-size: 18px;
  animation: fallHeart 6s linear infinite;
  opacity: 0;
  z-index: 2;
}

@keyframes fallHeart {
  0% { transform: translateY(-50px) rotate(0deg); opacity: 0; }
 10% { opacity: 0.8; }
 100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
}

.linea {
  font-size: 1.8em;
  font-weight: bold;
  margin: 60px 0;
  opacity: 0;
  animation: aparecer 3s forwards;
}

@keyframes aparecer {
 0% { opacity: 0; transform: translateY(20px); }
 30% { opacity: 1; color: #ff9a9e; text-shadow: 0 0 20px #ff4d6d; }
  100% { opacity: 1; color: #fff; text-shadow: 0 0 10px #ff9a9e; }
}

.linea:nth-child(2) { animation-delay: 0s; }
.linea:nth-child(3) { animation-delay: 3.5s; }
.linea
